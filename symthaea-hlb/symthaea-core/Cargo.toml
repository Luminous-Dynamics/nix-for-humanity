[package]
name = "symthaea-core"
version = "0.1.0"
edition = "2021"
description = "Core HDC, Φ engine, and minimal consciousness pipeline for Symthaea"
license = "MIT"

[dependencies]
ndarray = { version = "0.15", features = ["rayon"] }
nalgebra = "0.33"
rayon = "1.8"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
rand_chacha = "0.3"
tracing = "0.1"
tokio = { version = "1.35", features = ["full"] }
once_cell = "1.19"
blake3 = "1.5"
bumpalo = "3.14"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hdc_improvements"
harness = false

[features]
default = []
embeddings = []      # External embedding integration
rayon = []           # Parallel processing with rayon
thread_local_cache = []  # Thread-local caching optimization

