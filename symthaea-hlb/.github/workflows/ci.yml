# L3: GitHub Actions CI/CD Pipeline
#
# Automated build, test, and release pipeline for Symthaea HLB

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quick syntax and formatting check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy: warn on all, deny on correctness issues
      # Dead code, unused vars/imports, and cfg issues are being addressed incrementally
      - name: Run clippy (library, default features)
        run: |
          cargo clippy --lib -- \
            -A dead-code -A unused-variables -A unused-imports -A unexpected-cfgs \
            -D clippy::correctness

      - name: Run clippy (service binary)
        run: |
          cargo clippy --bin symthaea --features service -- \
            -A dead-code -A unused-variables -A unused-imports -A unexpected-cfgs \
            -D clippy::correctness

      - name: No crate-root dead_code suppression
        run: |
          if grep -q '#!\[allow(dead_code' src/lib.rs; then
            echo "::error::Crate-root #![allow(dead_code)] found in src/lib.rs. Use targeted #[allow(dead_code)] instead."
            exit 1
          fi

      - name: No archive directories in tree
        run: |
          if find . -name '.archive*' -type d | grep -q .; then
            echo "::error::.archive* directories found in tree"
            find . -name '.archive*' -type d
            exit 1
          fi

  # Build and test on multiple platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Can add macos-latest, windows-latest if needed
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build library
        run: cargo build --lib --release

      - name: Build binaries (default features)
        run: cargo build --bins --release

      - name: Build with shell feature
        run: cargo build --features shell --release

      - name: Build with service feature
        run: cargo build --features service --release

  # Run tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --release

      - name: Run integration tests
        run: cargo test --test '*' --release

      - name: Run doc tests
        run: cargo test --doc --release

  # Property-based tests
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-proptest-${{ hashFiles('**/Cargo.lock') }}

      - name: Run property tests
        run: cargo test --test property_tests --release -- --test-threads=4
        env:
          PROPTEST_CASES: 1000

  # Benchmarks (optional, on release tags)
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --bench hdc_bench -- --noplot

      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --no-deps --all-features

      - name: Archive documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc/

  # Nix build (if flake.nix exists)
  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-build

      - name: Build with Nix
        run: nix build --print-build-logs

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # Coverage report (optional)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lib --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # Release job (on tags)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, build, test, nix-build, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Build release binaries
        run: |
          cargo build --release --bins
          mkdir -p dist
          cp target/release/symthaea-shell dist/ || true
          cp target/release/symthaea-service dist/ || true
          cp target/release/symthaea-gui dist/ || true
          cp target/release/symthaea-repl dist/ || true

      - name: Create release archive
        run: |
          cd dist
          tar -czvf ../symthaea-${{ github.ref_name }}-linux-x86_64.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: symthaea-*.tar.gz
          draft: true
          generate_release_notes: true
