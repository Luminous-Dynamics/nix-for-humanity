# Pre-commit hooks for Luminous Nix
# Ensures code quality before commits

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=88]
        exclude: ^(dist-releases/|dist-v|dist-intelligent/|src/luminous_nix/ai/config_generator\.py)

  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.5
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(dist-releases/|dist-v|dist-intelligent/|src/luminous_nix/ai/config_generator\.py)

  # Pre-commit hooks for general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(\.github/workflows/performance-regression\.yml|mkdocs\.yml)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-toml

  # Local hooks - pytest
  - repo: local
    hooks:
      - id: pytest-quick
        name: Run quick tests
        entry: poetry run pytest tests/test_core_imports.py -v
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
