version: '3.8'

services:
  # Main application
  luminous-gui:
    build: .
    container_name: luminous-gui
    ports:
      - "5000:5000"
    environment:
      - LUMINOUS_DEBUG_MODE=false
      - LUMINOUS_DATA_DIR=/data
      - LUMINOUS_CONFIG_DIR=/config
      - LUMINOUS_LOG_DIR=/logs
      - LUMINOUS_OPTIMIZATION_AUTO_APPLY=true
      - LUMINOUS_ENABLE_PATTERN_LEARNING=true
      - FLASK_ENV=production
    volumes:
      - ./data:/data
      - ./config:/config
      - ./logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - luminous-network

  # Monitoring dashboard (optional)
  monitoring:
    build: .
    container_name: luminous-monitoring
    command: python monitoring_dashboard.py --simple
    environment:
      - LUMINOUS_DATA_DIR=/data
      - LUMINOUS_CONFIG_DIR=/config
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
      - ./logs:/logs:ro
    depends_on:
      - luminous-gui
    networks:
      - luminous-network
    profiles:
      - monitoring

  # Redis cache (optional, for horizontal scaling)
  redis:
    image: redis:7-alpine
    container_name: luminous-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - luminous-network
    profiles:
      - scale

  # PostgreSQL (optional, for horizontal scaling)
  postgres:
    image: postgres:15-alpine
    container_name: luminous-postgres
    environment:
      - POSTGRES_DB=luminous_gui
      - POSTGRES_USER=luminous
      - POSTGRES_PASSWORD=changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - luminous-network
    profiles:
      - scale

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: luminous-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - luminous-gui
    restart: unless-stopped
    networks:
      - luminous-network
    profiles:
      - production

networks:
  luminous-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data: