[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "luminous-nix"
version = "0.8.1"
description = "AI-powered natural language interface for NixOS using EmbeddingGemma and specialized HRM"
readme = "README.md"
license = "MIT"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
maintainers = ["Luminous Dynamics <nix-for-humanity@luminousdynamics.org>"]
keywords = [
    "nixos",
    "natural-language",
    "ai",
    "accessibility",
    "symbiotic-intelligence",
    "consciousness-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "luminous_nix", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11,<3.15"  # Allow 3.11, 3.12, 3.13, 3.14 (limited by PyInstaller)

# Core dependencies - minimal set required for basic functionality
requests = "^2.31.0"
click = "^8.1.0"
colorama = "^0.4.6"
python-dotenv = "^1.0.0"
jsonlines = "^3.1.0"
rich = "^13.7.0"
tree-sitter = "^0.25.1"
tree-sitter-nix = "^0.1.0"
psutil = "^6.0.0"
pyyaml = "^6.0.2"
jsonschema = "^4.25.0"
cryptography = "^41.0.0"

# Optional dependencies (GUI/TUI, prompts)
textual = {version = "^5.3.0", optional = true}
textual-dev = {version = "^1.2.0", optional = true}
blessed = {version = "^1.20.0", optional = true}
pyperclip = {version = "^1.8.2", optional = true}
typer = {version = "^0.15.1", optional = true}
prompt-toolkit = {version = "^3.0.43", optional = true}
questionary = {version = "^2.0.1", optional = true}
inquirer = {version = "^3.1.0", optional = true}

# Voice (opt-in)
vosk = {version = "^0.3.45", optional = true}
py-espeak-ng = {version = "^0.1.8", optional = true}
openai-whisper = {version = ">=20230918", optional = true}
pyaudio = {version = "^0.2.14", optional = true}
sounddevice = {version = "^0.5.1", optional = true}
piper-tts = {version = "^1.3.0", optional = true}
speechrecognition = {version = "^3.14.3", optional = true}
pyttsx3 = {version = "^2.99", optional = true}

# Web (opt-in)
flask = {version = "^3.0.0", optional = true}
gunicorn = {version = "^21.2.0", optional = true}
PyJWT = {version = "^2.8.0", optional = true}
pyOpenSSL = {version = "^24.0.0", optional = true}
websockets = {version = "^12.0", optional = true}
flask-socketio = {version = "^5.3.0", optional = true}
python-socketio = {version = "^5.11.0", optional = true}
flask-cors = {version = "^6.0.1", optional = true}
flask-limiter = {version = "^3.12", optional = true}
aiohttp = {version = "^3.9.0", optional = true}
aiohttp-cors = {version = "^0.8.1", optional = true}
fastapi = {version = "^0.116.1", optional = true}
uvicorn = {version = "^0.35.0", optional = true}
sse-starlette = {version = "^2.2.1", optional = true}
pydantic = {version = "^2.11.7", optional = true}

# ML/AI (opt-in)
numpy = {version = "^1.24.0", optional = true}
nltk = {version = "^3.8", optional = true}
transformers = {version = "^4.36.0", optional = true}
torch = {version = "^2.6.0", optional = true}
scikit-learn = {version = "^1.3.0", optional = true}
sentence-transformers = {version = "^2.2.0", optional = true}
redis = {version = "^5.0.0", optional = true}
beautifulsoup4 = {version = "^4.12.0", optional = true}
lxml = {version = "^4.9.0", optional = true}
faiss-cpu = {version = "^1.7.4", optional = true}
llama-cpp-python = {version = "^0.2.0", optional = true}

huggingface-hub = {version = "^0.34.0", optional = true}
safetensors = {version = "^0.4.0", optional = true}
accelerate = {version = "^1.10.1", optional = true}
datasets = {version = "^2.14.0", optional = true}
peft = {version = "^0.7.0", optional = true}
trl = {version = "^0.7.0", optional = true}
lancedb = {version = "^0.5.0", optional = true}
optimum = {version = "^1.16.0", optional = true}
evaluate = {version = "^0.4.0", optional = true}
networkx = {version = "^3.0", optional = true}
shap = {version = "^0.44.0", optional = true}
opentelemetry-api = {version = "^1.22.0", optional = true}
opentelemetry-sdk = {version = "^1.22.0", optional = true}
duckdb = {version = "^1.3.2", optional = true}
kuzu = {version = "^0.11.1", optional = true}
aiofiles = {version = "^24.1.0", optional = true}
chromadb = {version = "^1.0.20", optional = true}
pandas = {version = "^2.3.1", optional = true}
tree-sitter-python = {version = "^0.23.6", optional = true}
astor = {version = "^0.8.1", optional = true}
glances = {version = "^4.3.1", optional = true}
py3nvml = {version = "^0.2.7", optional = true}
gpustat = {version = "^1.1.1", optional = true}
vllm = {version = ">=0.10.2", optional = true, python = ">=3.13,<3.14"}
adam-atan2 = {version = "^0.0.3", optional = true}
einops = {version = "^0.8.1", optional = true}
coolname = {version = "^2.2.0", optional = true}
argdantic = {version = "^1.3.3", optional = true}
wandb = {version = "^0.22.0", optional = true}
omegaconf = {version = "^2.3.0", optional = true}
hydra-core = {version = "^1.3.2", optional = true}

[tool.poetry.group.dev.dependencies]
# Testing (from requirements.txt)
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.10.0"
requests-mock = "^1.11.0"

# Code quality
black = "^23.11.0"
ruff = "^0.1.5"
mypy = "^1.7.0"
bandit = "^1.7.5"
semgrep = "^1.45.0"  # Pattern-based static analysis
safety = "^3.0.0"  # Security vulnerability scanning

# Type stubs
types-colorama = "*"
types-requests = "*"
types-PyYAML = "*"

# Documentation
mkdocs = "^1.5.3"
mkdocs-material = "^9.4.0"

# Development tools
watchdog = "^3.0.0"
tqdm = "^4.65.0"
ipython = "^8.17.0"
pre-commit = "^4.3.0"
tree-sitter = "^0.25.1"
tree-sitter-python = "^0.23.6"
tree-sitter-nix = "^0.1.0"
pyyaml = "^6.0.2"
pyttsx3 = "^2.99"
speechrecognition = "^3.14.3"
pocketsphinx = "^5.0.4"
asciinema = "^2.4.0"
mkdocs-include-markdown-plugin = "^7.1.6"
pymdown-extensions = "^10.16.1"
pyinstaller = "^6.15.0"
wandb = "^0.22.0"

[tool.poetry.extras]
tui = ["textual", "textual-dev", "blessed", "pyperclip", "typer", "prompt-toolkit", "questionary", "inquirer"]
voice = ["vosk", "py-espeak-ng", "openai-whisper", "pyaudio", "sounddevice", "piper-tts", "speechrecognition", "pyttsx3"]
web = ["flask", "gunicorn", "PyJWT", "pyOpenSSL", "websockets", "flask-socketio", "python-socketio", "cryptography", "flask-cors", "flask-limiter", "aiohttp", "aiohttp-cors", "fastapi", "uvicorn", "sse-starlette", "pydantic"]
ml = ["numpy", "nltk", "transformers", "torch", "scikit-learn", "sentence-transformers", "redis", "beautifulsoup4", "lxml", "faiss-cpu", "llama-cpp-python", "huggingface-hub", "safetensors"]
advanced = ["accelerate", "datasets", "peft", "trl", "lancedb", "optimum", "evaluate", "networkx", "shap", "opentelemetry-api", "opentelemetry-sdk", "duckdb", "kuzu", "aiofiles", "chromadb", "pandas", "tree-sitter-python", "astor", "glances", "py3nvml", "gpustat", "vllm", "adam-atan2", "einops", "coolname", "argdantic", "wandb", "omegaconf", "hydra-core"]
all = ["textual", "textual-dev", "blessed", "pyperclip", "typer", "prompt-toolkit", "questionary", "inquirer", "vosk", "py-espeak-ng", "openai-whisper", "pyaudio", "sounddevice", "piper-tts", "speechrecognition", "pyttsx3", "flask", "gunicorn", "PyJWT", "pyOpenSSL", "websockets", "flask-socketio", "python-socketio", "cryptography", "flask-cors", "flask-limiter", "aiohttp", "aiohttp-cors", "fastapi", "uvicorn", "sse-starlette", "pydantic", "numpy", "nltk", "transformers", "torch", "scikit-learn", "sentence-transformers", "redis", "beautifulsoup4", "lxml", "faiss-cpu", "llama-cpp-python", "huggingface-hub", "safetensors", "accelerate", "datasets", "peft", "trl", "lancedb", "optimum", "evaluate", "networkx", "shap", "opentelemetry-api", "opentelemetry-sdk", "duckdb", "kuzu", "aiofiles", "chromadb", "pandas", "tree-sitter-python", "astor", "glances", "py3nvml", "gpustat", "vllm", "adam-atan2", "einops", "coolname", "argdantic", "wandb", "omegaconf", "hydra-core"]

[tool.poetry.urls]
"Homepage" = "https://github.com/Luminous-Dynamics/luminous-nix"
"Repository" = "https://github.com/Luminous-Dynamics/luminous-nix.git"
"Issues" = "https://github.com/Luminous-Dynamics/luminous-nix/issues"
"Discussions" = "https://github.com/Luminous-Dynamics/luminous-nix/discussions"

[tool.poetry.scripts]
ask-nix = "luminous_nix.cli:main"
ask-nix-voice = "luminous_nix.cli_voice:main"
nix-tui = "luminous_nix.tui.app:run"
nix-humanity-server = "luminous_nix.web.server:main"
docs = "mkdocs.commands.serve:serve"

# Note: Poetry automatically handles package discovery from the 'packages' field above
# Package data is handled via include patterns in pyproject.toml or MANIFEST.in

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "0.4.0"
line-length = 88
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "S101",  # use of assert (common in tests)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow asserts in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "7.4.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=luminous_nix",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"
